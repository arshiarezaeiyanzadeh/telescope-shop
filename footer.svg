<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 280" width="100%" height="100%">
  <defs>
    <!-- ۱. تعریف ۴ رنگ اصلی بنفش درخواستی -->
    <linearGradient id="wavePurpleGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#800080" stop-opacity="0.85" />
      <stop offset="33%" stop-color="#9400D3" stop-opacity="0.75" />
      <stop offset="66%" stop-color="#BF00FF" stop-opacity="0.75" />
      <stop offset="100%" stop-color="#FF00FF" stop-opacity="0.85" />
    </linearGradient>

    <linearGradient id="backWaveGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#BF00FF" stop-opacity="0.4" />
      <stop offset="50%" stop-color="#800080" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#9400D3" stop-opacity="0.4" />
    </linearGradient>

    <!-- ۲. هاله عمودی شفاف‌کننده و درخشان -->
    <linearGradient id="verticalHaloGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0" />
      <stop offset="30%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="70%" stop-color="#ffffff" stop-opacity="0.15" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>

    <!-- ۳. برش اختصاصی فرم موج برای محدود کردن ستاره‌ها فقط داخل موج -->
    <clipPath id="waveClip">
      <path>
        <animate attributeName="d" dur="8s" repeatCount="indefinite"
          values="
            M0,130 C320,70 420,190 720,130 C1020,70 1120,190 1440,130 L1440,280 L0,280 Z;
            M0,160 C300,210 450,80 720,150 C990,220 1140,90 1440,160 L1440,280 L0,280 Z;
            M0,110 C350,60 400,200 720,120 C1040,40 1100,180 1440,110 L1440,280 L0,280 Z;
            M0,130 C320,70 420,190 720,130 C1020,70 1120,190 1440,130 L1440,280 L0,280 Z
          " />
      </path>
    </clipPath>
  </defs>

  <!-- لایه موج پس‌زمینه کمکی برای عمق فضایی -->
  <path fill="url(#backWaveGrad)">
    <animate attributeName="d" dur="11s" repeatCount="indefinite"
      values="
        M0,160 C360,90 540,220 900,150 C1160,100 1300,210 1440,160 L1440,280 L0,280 Z;
        M0,120 C280,190 600,100 860,170 C1120,240 1320,110 1440,120 L1440,280 L0,280 Z;
        M0,160 C360,90 540,220 900,150 C1160,100 1300,210 1440,160 L1440,280 L0,280 Z
      " />
  </path>

  <!-- محتویات اصلی محصور در داخل موج -->
  <g clip-path="url(#waveClip)">
    <!-- پس‌زمینه مشکی عمیق کیهانی -->
    <rect width="1440" height="280" fill="#04020a" />

    <!-- ستاره‌های وکتوری کیهان و سحابی‌ها -->
    <g fill="#ffffff">
      <!-- ستاره‌های ریز -->
      <circle cx="45" cy="190" r="1" opacity="0.9"/>
      <circle cx="120" cy="240" r="1.2" opacity="0.7"/>
      <circle cx="190" cy="160" r="0.8" opacity="0.6"/>
      <circle cx="260" cy="220" r="1.5" opacity="0.85"/>
      <circle cx="340" cy="180" r="1" opacity="0.5"/>
      <circle cx="410" cy="250" r="1.3" opacity="0.9"/>
      <circle cx="490" cy="170" r="0.9" opacity="0.6"/>
      <circle cx="560" cy="210" r="1.7" opacity="0.95"/>
      <circle cx="630" cy="260" r="1.1" opacity="0.7"/>
      <circle cx="710" cy="160" r="1.4" opacity="0.8"/>
      <circle cx="780" cy="230" r="0.8" opacity="0.5"/>
      <circle cx="850" cy="190" r="1.6" opacity="0.9"/>
      <circle cx="920" cy="240" r="1" opacity="0.75"/>
      <circle cx="1000" cy="170" r="1.3" opacity="0.85"/>
      <circle cx="1070" cy="220" r="0.9" opacity="0.6"/>
      <circle cx="1150" cy="260" r="1.5" opacity="0.95"/>
      <circle cx="1220" cy="180" r="1.2" opacity="0.7"/>
      <circle cx="1300" cy="230" r="1.4" opacity="0.8"/>
      <circle cx="1380" cy="190" r="0.9" opacity="0.5"/>
      <circle cx="1420" cy="250" r="1.3" opacity="0.9"/>

      <!-- ستاره‌های درخشان و پرنور چشمک‌زن -->
      <circle cx="150" cy="180" r="2.2" fill="#c084fc">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.5s" repeatCount="indefinite" />
      </circle>
      <circle cx="480" cy="230" r="2.5" fill="#f0abfc">
        <animate attributeName="opacity" values="1;0.2;1" dur="3.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="820" cy="160" r="2.8" fill="#e879f9">
        <animate attributeName="opacity" values="0.4;1;0.4" dur="2.8s" repeatCount="indefinite" />
      </circle>
      <circle cx="1180" cy="210" r="2.4" fill="#d8b4fe">
        <animate attributeName="opacity" values="0.8;0.2;0.8" dur="3.6s" repeatCount="indefinite" />
      </circle>
    </g>

    <!-- لایه رنگ‌های ۴‌گانه بنفش نیمه‌شفاف روی ستاره‌ها -->
    <rect width="1440" height="280" fill="url(#wavePurpleGrad)" />

    <!-- هاله عمودی متحرک (جاروب نوری افقی که پس‌زمینه ستاره‌ها را کاملاً شفاف و واضح نشان می‌دهد) -->
    <rect x="-300" y="0" width="260" height="280" fill="url(#verticalHaloGrad)" style="mix-blend-mode: overlay;">
      <animate attributeName="x" from="-300" to="1500" dur="4.5s" repeatCount="indefinite" />
    </rect>
  </g>
</svg>
