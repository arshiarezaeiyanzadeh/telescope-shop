<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 180" width="100%" height="100%">
  <defs>
    <linearGradient id="purpleGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#BF00FF" stop-opacity="0.52" />
      <stop offset="33%" stop-color="#FF00FF" stop-opacity="0.42" />
      <stop offset="66%" stop-color="#9400D3" stop-opacity="0.48" />
      <stop offset="100%" stop-color="#800080" stop-opacity="0.58" />
    </linearGradient>

    <linearGradient id="backWaveGrad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#FF00FF" stop-opacity="0.22" />
      <stop offset="50%" stop-color="#800080" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#BF00FF" stop-opacity="0.20" />
    </linearGradient>

    <linearGradient id="revealMaskGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="25%" stop-color="#d5d5d5" />
      <stop offset="40%" stop-color="#707070" />
      <stop offset="50%" stop-color="#000000" />
      <stop offset="60%" stop-color="#707070" />
      <stop offset="75%" stop-color="#d5d5d5" />
      <stop offset="100%" stop-color="#ffffff" />
    </linearGradient>

    <mask id="haloClearMask">
      <rect width="1440" height="180" fill="#ffffff" />
      <rect x="-600" y="0" width="600" height="180" fill="url(#revealMaskGrad)">
        <animate attributeName="x" from="-600" to="1600" dur="5.5s" repeatCount="indefinite" />
      </rect>
    </mask>

    <clipPath id="waveClip">
      <path>
        <animate attributeName="d" dur="7s" repeatCount="indefinite"
          values="
            M0,60 C320,130 420,-15 720,55 C1020,125 1120,-15 1440,60 L1440,180 L0,180 Z;
            M0,45 C300,-15 460,115 720,45 C980,-20 1140,105 1440,45 L1440,180 L0,180 Z;
            M0,75 C360,10 520,125 720,65 C920,10 1180,115 1440,75 L1440,180 L0,180 Z;
            M0,60 C320,130 420,-15 720,55 C1020,125 1120,-15 1440,60 L1440,180 L0,180 Z
          " />
      </path>
    </clipPath>
  </defs>

  <path fill="url(#backWaveGrad)">
    <animate attributeName="d" dur="9s" repeatCount="indefinite"
      values="
        M0,80 C360,10 540,130 900,65 C1160,15 1300,125 1440,80 L1440,180 L0,180 Z;
        M0,50 C280,120 600,20 860,80 C1120,140 1320,30 1440,50 L1440,180 L0,180 Z;
        M0,80 C360,10 540,130 900,65 C1160,15 1300,125 1440,80 L1440,180 L0,180 Z
      " />
  </path>

  <g clip-path="url(#waveClip)">
    
    <rect width="1440" height="180" fill="#030108" />

    <image href="universe.jpg" width="1440" height="180" preserveAspectRatio="xMidYMid slice" />

    <g fill="#ffffff">
      <circle cx="40" cy="110" r="0.9" opacity="0.85"/>
      <circle cx="85" cy="150" r="1.3" opacity="0.9"/>
      <circle cx="150" cy="90" r="0.8" opacity="0.75"/>
      <circle cx="210" cy="135" r="1.4" opacity="0.9"/>
      <circle cx="275" cy="100" r="1" opacity="0.7"/>
      <circle cx="340" cy="160" r="1.2" opacity="0.95"/>
      <circle cx="415" cy="95" r="0.9" opacity="0.8"/>
      <circle cx="485" cy="140" r="1.6" opacity="0.95"/>
      <circle cx="560" cy="115" r="1.1" opacity="0.75"/>
      <circle cx="630" cy="155" r="1.5" opacity="0.9"/>
      <circle cx="710" cy="95" r="1.2" opacity="0.85"/>
      <circle cx="780" cy="135" r="0.8" opacity="0.7"/>
      <circle cx="855" cy="110" r="1.7" opacity="0.95"/>
      <circle cx="925" cy="160" r="1.1" opacity="0.85"/>
      <circle cx="1005" cy="100" r="1.3" opacity="0.9"/>
      <circle cx="1075" cy="145" r="0.9" opacity="0.75"/>
      <circle cx="1155" cy="120" r="1.5" opacity="0.95"/>
      <circle cx="1225" cy="160" r="1.2" opacity="0.85"/>
      <circle cx="1305" cy="105" r="1.4" opacity="0.9"/>
      <circle cx="1385" cy="140" r="0.9" opacity="0.8"/>
      <circle cx="1415" cy="110" r="1.3" opacity="0.9"/>

      <circle cx="125" cy="105" r="2.2" fill="#f0abfc">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="440" cy="145" r="2.5" fill="#ffffff">
        <animate attributeName="opacity" values="1;0.2;1" dur="3s" repeatCount="indefinite" />
      </circle>
      <circle cx="770" cy="105" r="2.3" fill="#e9d5ff">
        <animate attributeName="opacity" values="0.3;1;0.3" dur="2.2s" repeatCount="indefinite" />
      </circle>
      <circle cx="1110" cy="135" r="2.4" fill="#f5d0fe">
        <animate attributeName="opacity" values="0.9;0.2;0.9" dur="3.4s" repeatCount="indefinite" />
      </circle>
      <circle cx="1340" cy="115" r="2.1" fill="#ffffff">
        <animate attributeName="opacity" values="0.2;1;0.2" dur="2.7s" repeatCount="indefinite" />
      </circle>
    </g>

    <rect width="1440" height="180" fill="url(#purpleGradient)" mask="url(#haloClearMask)" />

  </g>
</svg>
